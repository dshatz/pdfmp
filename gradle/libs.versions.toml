[versions]
kotlin = "2.3.0"
jni = "2.0.5-SNAPSHOT"
agp = "8.10.1"
filepicker = "0.12.0"
publish = "0.35.0"
skiko = "0.9.22.2"
kotest = "6.1.0"
ktor = "3.4.0"
osdetect = "1.7.3"

[plugins]
mp = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
knee = { id = "io.deepmedia.tools.knee", version = "1.2.0" }
android-lib = { id = "com.android.library", version.ref = "agp" }
android-lib-mp = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-app = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version = "2.3.4" }
compose-kt = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version = "1.10.0" }
atomicfu = { id = "org.jetbrains.kotlinx.atomicfu", version = "0.30.0" }
publish = { id = "com.vanniktech.maven.publish", version.ref = "publish" }
kotest = { id = "io.kotest", version.ref = "kotest" }
osdetector = { id = "com.google.osdetector", version.ref = "osdetect" }

[libraries]
jni = { module = "com.dshatz.kni:jni", version.ref = "jni" }
jni-buffers = { module = "com.dshatz.kni:buffers", version.ref = "jni" }
jni-ksp = { module = "com.dshatz.kni:ksp", version.ref = "jni" }
jni-annotations = { module = "com.dshatz.kni:annotations", version.ref = "jni" }
io = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version = "0.8.2" }
kotest = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
ktor-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
osdetector-plugin = { module = "com.google.gradle:osdetector-gradle-plugin", version.ref = "osdetect" }


# For zero-copy bitmap on desktop.
skiko = { module = "org.jetbrains.skiko:skiko", version.ref = "skiko" }

coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.10.2" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version = "1.10.2" }