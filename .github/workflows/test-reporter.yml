name: Reusable Reporter
on:
  workflow_call:
    inputs:
      platform_name:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      pr_number:
        required: false
        type: string

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR Number from Run ID
        id: get_pr
        continue-on-error: true
        run: |
          PR_NUMBER=$(cat pr_number.txt/pr_number.txt)
          echo "nr=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Publish ${{ inputs.platform_name }} Test Results
        uses: dshatz/github-test-reporter@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          report-path: "${{ inputs.artifact_name }}/**/*.xml"
          status-check: true
          pull-request-report: false
          issue: ${{ inputs.pr_number || steps.get_pr.outputs.nr }}
          status-check-name: ${{ inputs.platform_name }}
          integrations-config: |
            {
              "junit-to-ctrf": {
                "enabled": true,
                "action": "convert",
                "options": {
                  "output": "./ctrf-reports/ctrf-report.json",
                  "toolname": "junit-to-ctrf",
                  "useSuiteName": false,
                  "env": {
                    "appName": "pdfmp"
                  }
                }
              }
            }