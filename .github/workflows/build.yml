name: Test

on:
  push:
    branches:
      - main
      - develop
  pull_request_target:
    branches:
      - main
      - develop
  release:
    types: [created]

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Save PR number
        if: github.event_name == 'pull_request'
        run: echo ${{ github.event.number }} > pr_number.txt
      - name: Upload PR number
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pr-number.txt
          path: pr_number.txt
          archive: false


  # pull_request_target note:
  # in build steps we checkout the code so it's a dangerous environment.
  # Don't give any permissions except contents: read.

  test-linux:
    name: Linux x64
    if: github.event_name == 'push' || github.event_name == 'pull_request_target' || github.event_name == 'release'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup
        uses: ./.github/actions/build-setup
      - name: Run Tests
        run: ./gradlew jacocoTestReport --stacktrace -PnativeTargets=linuxX64
      - name: Upload linuxX64
        uses: ./.github/actions/upload-test-results
        with:
          platform: linuxX64
          kotlinTarget: linuxX64
      - name: Upload jvm
        uses: ./.github/actions/upload-test-results
        with:
          platform: linux-jvm
          kotlinTarget: jvm

      # Build and upload APKs for instrumented testing.
      - name: Build Android Test
        if: false
        run: |
          ./gradlew pdfmp:assembleAndroidDeviceTest pdfmp-compose:assembleAndroidDeviceTest\
            -PnativeTargets=androidNativeArm64
      - name: Upload Android Test APK (pdfmp)
        if: false
        uses: actions/upload-artifact@v7
        with:
          name: pdfmp-test.apk
          archive: false
          path: 'pdfmp-compose/build/outputs/apk/androidTest/pdfmp-compose-androidTest.apk'
      - name: Upload Android Test APK (pdfmp-compose)
        if: false
        uses: actions/upload-artifact@v7
        with:
          name: pdfmp-compose-test.apk
          archive: false
          path: 'pdfmp/build/outputs/apk/androidTest/pdfmp-androidTest.apk'

  test-windows:
    name: Windows x64
    permissions:
      contents: read
    #    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'release'
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup
        uses: ./.github/actions/build-setup
      - name: Run Tests
        run: ./gradlew jacocoTestReport --stacktrace -PnativeTargets=mingwX64
      - name: Upload windowsX64
        uses: ./.github/actions/upload-test-results
        with:
          platform: windowsX64
          kotlinTarget: mingwX64
      - name: Upload jvm
        uses: ./.github/actions/upload-test-results
        with:
          platform: windows-jvm
          kotlinTarget: jvm

  test-macos:
    name: macOS Arm
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Run Tests macOS
        run: ./gradlew jacocoTestReport --stacktrace -PnativeTargets=iosSimulatorArm64,macosArm64
      - name: Upload
        uses: ./.github/actions/upload-test-results
        with:
          platform: macosArm64
          kotlinTarget: macosArm64
      - name: Upload
        uses: ./.github/actions/upload-test-results
        with:
          platform: iosSimulatorArm64
          kotlinTarget: iosSimulatorArm64
      - name: Upload jvm
        uses: ./.github/actions/upload-test-results
        with:
          platform: macos-jvm
          kotlinTarget: jvm

  test-android-pdfmp:
    name: Android (pdfmp)
    runs-on: ubuntu-latest
    needs: test-linux
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/actions
      - name: Test pdfmp
        continue-on-error: true
        uses: ./.github/actions/test-android
        with:
          module: pdfmp
      - name: Upload results
        uses: ./.github/actions/upload-test-results
        with:
          platform: android-pdfmp

  test-android-pdfmp-compose:
    name: Android (pdfmp-compose)
    runs-on: ubuntu-latest
    needs: test-linux
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/actions
      - name: Test pdfmp-compose
        uses: ./.github/actions/test-android
        continue-on-error: true
        with:
          module: pdfmp-compose
      - name: Upload results
        uses: ./.github/actions/upload-test-results
        with:
          platform: android-pdfmp-compose


  test-results-linux:
    needs: test-linux
    uses: ./.github/workflows/test-reporter.yml
    with:
      platform_name: Linux x64
      artifact_name: test-report-linux*
    secrets: inherit
  test-results-windows:
    needs: test-windows
    if: github.event.workflow_run.conclusion != 'cancelled'
    uses: ./.github/workflows/test-reporter.yml
    with:
      platform_name: Windows x64
      artifact_name: test-report-windows*
    secrets: inherit
  test-results-macos:
    needs: test-macos
    if: github.event.workflow_run.conclusion != 'cancelled'
    uses: ./.github/workflows/test-reporter.yml
    with:
      platform_name: macOS ARM
      artifact_name: test-report-macos*
    secrets: inherit
  test-results-ios:
    needs: test-macos
    if: github.event.workflow_run.conclusion != 'cancelled'
    uses: ./.github/workflows/test-reporter.yml
    with:
      platform_name: iOS Simulator
      artifact_name: test-report-ios*
    secrets: inherit
